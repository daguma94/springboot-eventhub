spring.application.name=api-gateway
server.port=8080

spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${USER_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/users/**

spring.cloud.gateway.server.webmvc.routes[1].id=event-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${EVENT_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/events/**

spring.cloud.gateway.server.webmvc.routes[2].id=booking-service
spring.cloud.gateway.server.webmvc.routes[2].uri=${BOOKING_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/bookings/**

# OpenAPI - Rutas hacia la documentación de los microservicios

spring.cloud.gateway.server.webmvc.routes[3].id=user-service-docs
spring.cloud.gateway.server.webmvc.routes[3].uri=${USER_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/user-service/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=RewritePath=/user-service/(?<segment>.*), /$\{segment}

spring.cloud.gateway.server.webmvc.routes[4].id=event-service-docs
spring.cloud.gateway.server.webmvc.routes[4].uri=${EVENT_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/event-service/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[4].filters[0]=RewritePath=/event-service/(?<segment>.*), /$\{segment}

spring.cloud.gateway.server.webmvc.routes[5].id=booking-service-docs
spring.cloud.gateway.server.webmvc.routes[5].uri=${BOOKING_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/booking-service/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[5].filters[0]=RewritePath=/booking-service/(?<segment>.*), /$\{segment}

# Swagger UI centralizado

springdoc.swagger-ui.urls[0].name=User Service
springdoc.swagger-ui.urls[0].url=/user-service/v3/api-docs

springdoc.swagger-ui.urls[1].name=Event Service
springdoc.swagger-ui.urls[1].url=/event-service/v3/api-docs

springdoc.swagger-ui.urls[2].name=Booking Service
springdoc.swagger-ui.urls[2].url=/booking-service/v3/api-docs

springdoc.swagger-ui.disable-swagger-default-url=true
