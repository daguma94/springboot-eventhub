apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-service
  template:
    metadata:
      labels:
        app: event-service
    spec:
      containers:
        - name: event-service
          image: eventhub-event-service:k8s-v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: DB_URL
              value: jdbc:postgresql://event-db:5432/eventhub_events
              
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: eventhub-db-secret
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eventhub-db-secret
                  key: DB_PASSWORD

---
apiVersion: v1
kind: Service
metadata:
  name: event-service
spec:
  selector:
    app: event-service
  ports:
    - port: 8082
      targetPort: 8082
  type: ClusterIP