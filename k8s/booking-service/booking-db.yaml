apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: booking-db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-db
  template:
    metadata:
      labels:
        app: booking-db
    spec:
      containers:
        - name: booking-db
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: eventhub_bookings
              
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: eventhub-db-secret
                  key: DB_USERNAME

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eventhub-db-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: booking-db-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: booking-db-storage
          persistentVolumeClaim:
            claimName: booking-db-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: booking-db
spec:
  selector:
    app: booking-db
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP