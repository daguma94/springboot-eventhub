apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      containers:
        - name: booking-service
          image: eventhub-booking-service:k8s-v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: DB_URL
              value: jdbc:postgresql://booking-db:5432/eventhub_bookings
              
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: eventhub-db-secret
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eventhub-db-secret
                  key: DB_PASSWORD

            - name: USER_SERVICE_URL
              value: http://user-service:8081

            - name: EVENT_SERVICE_URL
              value: http://event-service:8082

---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
spec:
  selector:
    app: booking-service
  ports:
    - port: 8083
      targetPort: 8083
  type: ClusterIP